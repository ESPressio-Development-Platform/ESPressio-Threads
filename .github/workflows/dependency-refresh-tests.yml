name: Dependency Refresh Tests

on:
  push:
  pull_request:

jobs:
  esp32-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: project/ESPressio-Threads
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Timing
          ref: main
          path: project/dependencies/ESPressio-Timing
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Units
          ref: main
          path: project/dependencies/ESPressio-Units
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: main
          path: project/dependencies/ESPressio-Observable
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Serializable
          ref: main
          path: project/dependencies/ESPressio-Serializable
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Task
          ref: main
          path: project/dependencies/ESPressio-Task
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Create consumer project
        shell: bash
        run: |
          mkdir -p project/compile/src
          cat > project/compile/platformio.ini <<'EOF'
          [env:esp32]
          platform = espressif32
          board = esp32dev
          framework = arduino
          build_flags =
              -std=gnu++17
              -fno-rtti
              -DESPRESSIO_SERIALIZATION_PREFER_PSRAM
          build_unflags =
              -std=gnu++11
              -frtti
          lib_ldf_mode = deep+
          lib_deps =
              ../dependencies/ESPressio-Task
              ../dependencies/ESPressio-Observable
              ../dependencies/ESPressio-Serializable
              ../dependencies/ESPressio-Units
              ../dependencies/ESPressio-Timing
              ../ESPressio-Threads
          EOF
          cat > project/compile/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <type_traits>
          #include <ESPressio_Thread.hpp>
          #include <ESPressio_PrecisionThread.hpp>
          #include <ESPressio_PrecisionThread_Serializable.hpp>

          using SerializableThreadTime = ESPressio::Units::SerializableNanoSeconds<uint64_t>;
          using SerializablePrecisionThread = ESPressio::Threads::PrecisionThread<SerializableThreadTime>;
          using Traits = ESPressio::Threads::PrecisionThreadTraits<SerializableThreadTime>;

          static_assert(std::is_same_v<typename Traits::IterationTime, SerializableThreadTime>);
          static_assert(std::is_same_v<typename Traits::IterationFrequency, ESPressio::Units::SerializableFrequency<double>>);

          void setup() {
              typename Traits::SignedIterationTime signedTime =
                  Traits::CreateSignedIterationTime(1000);
              typename Traits::IterationFrequency frequency =
                  Traits::CreateIterationFrequency(50.0);
              (void)signedTime;
              (void)frequency;
              (void)sizeof(SerializablePrecisionThread*);
          }
          void loop() {}
          EOF
      - name: Compile Threads against production Working Branch dependencies without RTTI
        run: pio run -d project/compile
