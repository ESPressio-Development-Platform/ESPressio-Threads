name: Prepare Threads 3.1.5 release

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'release/61-3.1.5-repository-relocation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/61-3.1.5-repository-relocation
      - name: Prepare documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md'); t=p.read_text();
          t=t.replace('This source tree is version **3.1.4**.','This source tree is version **3.1.5**.',1)
          t=t.replace('Timing >= 2.2.4 < 3.0.0','Timing >= 2.2.5 < 3.0.0',1)
          t=t.replace('Observable >= 3.0.1 < 4.0.0','Observable >= 3.0.2 < 4.0.0',1)
          t=t.replace('Timing 2.2.4 carries Units 0.2.3 and optional Serializable 0.10.2 downstream','Timing 2.2.5 carries Units 0.2.4 and optional Serializable 0.10.3 downstream',1)
          t=t.replace('ESPressio Threads `3.1.4` targets','ESPressio Threads `3.1.5` targets',1)
          t=t.replace('the `3.1.4` PlatformIO package','the `3.1.5` PlatformIO package',1)
          t=t.replace('espressio-development-platform/ESPressio-Threads@^3.1.4','espressio-development-platform/ESPressio-Threads@^3.1.5')
          p.write_text(t)
          p=Path('CHANGELOG.md'); t=p.read_text(); entry='''## 3.1.5 — 2026-08-22\n\n### Changed\n- Published the post-migration ESPressio Threads package generation from `ESPressio-Development-Platform`.\n- Raised required ESPressio Timing from `>=2.2.4 <3.0.0` to `>=2.2.5 <3.0.0`.\n- Raised required ESPressio Observable from `>=3.0.1 <4.0.0` to `>=3.0.2 <4.0.0`.\n- Updated package metadata, README installation/dependency guidance, CI validation, and dependency documentation.\n\n### Compatibility\n- No Threads public API or runtime behaviour changes are introduced by this repository-relocation patch release.\n\n''';
          if '## 3.1.5' not in t: t=t.replace('# Changelog\n\n','# Changelog\n\n'+entry,1)
          p.write_text(t)
          for f in ['ESPRESSIO_DEPENDENCY_CHART.md','ESPRESSIO_DEPENDENCY_CHART.svg']:
              p=Path(f); t=p.read_text();
              for a,b in [('Observable 3.0.1','Observable 3.0.2'),('Observable    3.0.1','Observable    3.0.2'),('Serializable 0.10.2','Serializable 0.10.3'),('Serializable  0.10.2','Serializable  0.10.3'),('Units 0.2.3','Units 0.2.4'),('Units         0.2.3','Units         0.2.4'),('Timing 2.2.4','Timing 2.2.5'),('Timing        2.2.4','Timing        2.2.5'),('Threads 3.1.4','Threads 3.1.5'),('Threads       3.1.4','Threads       3.1.5'),('Timing >= 2.2.4','Timing >= 2.2.5'),('Observable >= 3.0.1','Observable >= 3.0.2'),('Units >= 0.2.3','Units >= 0.2.4'),('Serializable >= 0.10.2','Serializable >= 0.10.3')]: t=t.replace(a,b)
              p.write_text(t)
          PY
      - name: Commit release preparation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md ESPRESSIO_DEPENDENCY_CHART.md ESPRESSIO_DEPENDENCY_CHART.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Prepare Threads 3.1.5 release documentation (#61)'
          git push
