name: Apply optimisation log

on:
  push:
    branches:
      - optimisation/69-resource-footprint
    paths:
      - .github/workflows/apply-optimisation-log.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimisation/69-resource-footprint
      - name: Append optimisation entries
        run: echo '' | base64 -d >> OPTIMISATIONS.md
      - name: Commit entries
        run: |
          git config user.name "ESPressio optimisation automation"
          git config user.email "actions@users.noreply.github.com"
          git add OPTIMISATIONS.md
          git commit -m "docs(#70,#76,#77): record phases 12-15 Thread optimisations"
          git push origin HEAD:optimisation/69-resource-footprint
