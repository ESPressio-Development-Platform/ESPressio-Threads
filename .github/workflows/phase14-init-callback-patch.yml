name: Phase 14 initialization callback patch

on:
  push:
    branches:
      - optimisation/69-resource-footprint
    paths:
      - .github/workflows/phase14-init-callback-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimisation/69-resource-footprint
      - name: Apply initialization callback patch
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/ESPressio_Thread.hpp')
          text = path.read_text()
          old = '''        if (status != ThreadInitializationStatus::Success) {\n            TOnThreadInitializationFailedEvent onInitializationFailed =\n                GetOnInitializationFailed();\n            if (onInitializationFailed != nullptr) {\n                try {\n                    onInitializationFailed(this, status);\n                } catch (...) {\n                }\n            }'''
          new = '''        if (status != ThreadInitializationStatus::Success) {\n            StableCallback<TOnThreadInitializationFailedEvent> onInitializationFailed;\n            {\n                std::lock_guard<std::mutex> lock(_callbackMutex);\n                onInitializationFailed = _onInitializationFailed;\n            }\n            if (onInitializationFailed != nullptr) {\n                try {\n                    (*onInitializationFailed)(this, status);\n                } catch (...) {\n                }\n            }'''
          if old not in text:
              raise SystemExit('Expected initialization callback block not found')
          path.write_text(text.replace(old, new, 1))
      - name: Commit patch
        run: |
          git config user.name "ESPressio optimisation automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/ESPressio_Thread.hpp
          git commit -m "perf(#76): retain initialization callback lifetime without copying"
          git push origin HEAD:optimisation/69-resource-footprint
