name: Resource Profile Regression

on:
  push:
  pull_request:

jobs:
  termination-queue-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: project/ESPressio-Threads
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Timing
          ref: 2.2.8
          path: project/dependencies/ESPressio-Timing
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Units
          ref: 0.2.7
          path: project/dependencies/ESPressio-Units
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: 3.0.2
          path: project/dependencies/ESPressio-Observable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install platformio
      - name: Create resource-profile consumers
        shell: bash
        run: |
          mkdir -p project/compile/src
          cat > project/compile/platformio.ini <<'EOF'
          [platformio]
          default_envs = default_profile, overridden_profile

          [base]
          platform = espressif32
          board = esp32dev
          framework = arduino
          build_flags = -std=gnu++17 -frtti
          build_unflags = -std=gnu++11 -fno-rtti
          lib_ldf_mode = deep+
          lib_deps =
              ../dependencies/ESPressio-Observable
              ../dependencies/ESPressio-Units
              ../dependencies/ESPressio-Timing
              ../ESPressio-Threads

          [env:default_profile]
          extends = base

          [env:overridden_profile]
          extends = base
          build_flags =
              ${base.build_flags}
              -DESPRESSIO_THREAD_TERMINATION_QUEUE_LENGTH=64
              -DEXPECTED_TERMINATION_QUEUE_LENGTH=64
          EOF
          cat > project/compile/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <ESPressio_ThreadTerminationDispatcher.hpp>

          #ifndef EXPECTED_TERMINATION_QUEUE_LENGTH
          #define EXPECTED_TERMINATION_QUEUE_LENGTH 32
          #endif

          static_assert(
              ESPRESSIO_THREAD_TERMINATION_QUEUE_LENGTH ==
                  EXPECTED_TERMINATION_QUEUE_LENGTH,
              "termination queue profile must remain configurable"
          );

          void setup() {
              (void)ESPressio::Threads::ThreadTerminationDispatcher::GetInstance();
          }

          void loop() { delay(1000); }
          EOF
      - name: Compile default and overridden resource profiles
        run: pio run -d project/compile
