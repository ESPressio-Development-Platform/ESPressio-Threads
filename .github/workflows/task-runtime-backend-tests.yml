name: Task Runtime Backend Tests

on:
  push:
  pull_request:

jobs:
  task-runtime-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard migrated worker ownership
        shell: bash
        run: |
          grep -q '<ESPressio_Task.hpp>' src/ESPressio_Thread.hpp
          grep -q 'Task::TaskRuntime::Create' src/ESPressio_Thread.hpp
          grep -q 'Task::TaskRuntime::Delete' src/ESPressio_Thread.hpp
          grep -q 'Task::TaskRuntime::Current' src/ESPressio_Thread.hpp
          grep -q 'Task::TaskRuntime::Suspend' src/ESPressio_Thread.hpp
          grep -q '<ESPressio_Synchronization.hpp>' src/ESPressio_Thread.hpp

          grep -q '<ESPressio_Task.hpp>' src/ESPressio_ThreadTerminationDispatcher.cpp
          grep -q 'Task::TaskRuntime::Create' src/ESPressio_ThreadTerminationDispatcher.cpp
          grep -q 'Task::TaskRuntime::Delete' src/ESPressio_ThreadTerminationDispatcher.cpp
          grep -q 'Task::TaskRuntime::Current' src/ESPressio_ThreadTerminationDispatcher.cpp

          # Automatic ReleaseOnTerminate reclamation belongs to the existing
          # termination dispatcher + ThreadManager path. A separate garbage
          # collector task must not return.
          grep -q 'ThreadManager::GetInstance()->CleanUpWithResult' src/ESPressio_ThreadTerminationDispatcher.cpp
          if find src -maxdepth 1 -type f -name '*GarbageCollector*' | grep -q .; then
            echo 'Dedicated Thread garbage collector API/task was reintroduced.' >&2
            exit 1
          fi
          if grep -R 'threadGarbageCollector\|ThreadGarbageCollector::GetInstance' src examples docs README.md; then
            echo 'Dedicated garbage collector references remain in the public surface.' >&2
            exit 1
          fi

          if grep -E 'freertos/|TaskHandle_t|BaseType_t|UBaseType_t|xTaskCreate(PinnedToCore)?|vTaskDelete|xTaskGetCurrentTaskHandle|vTaskSuspend|ulTaskNotifyTake|xTaskNotifyGive|portNUM_PROCESSORS|configNUMBER_OF_CORES' src/ESPressio_Thread.hpp src/ESPressio_ThreadManager.hpp src/ESPressio_ThreadTerminationDispatcher.cpp; then
            echo 'Threads regressed to direct FreeRTOS runtime ownership.' >&2
            exit 1
          fi

          grep -q 'ESPressio-Task' library.json
          grep -q 'feature/1-task-execution' library.json
          grep -q 'feature/29-platform-clock-abstractions' library.json

  esp32-task-runtime-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: project/ESPressio-Threads
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: feature/1-system-memory-policy
          path: project/dependencies/ESPressio-System
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Task
          ref: feature/1-task-execution
          path: project/dependencies/ESPressio-Task
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: feature/16-rtti-free-observer-registry
          path: project/dependencies/ESPressio-Observable
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Timing
          ref: feature/29-platform-clock-abstractions
          path: project/dependencies/ESPressio-Timing
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Units
          ref: main
          path: project/dependencies/ESPressio-Units
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install platformio
      - name: Create lifecycle compile project
        shell: bash
        run: |
          mkdir -p project/compile/src
          cat > project/compile/platformio.ini <<'EOF'
          [env:esp32]
          platform = espressif32
          board = esp32dev
          framework = arduino
          build_flags = -std=gnu++17 -frtti
          build_unflags = -std=gnu++11 -fno-rtti
          lib_ldf_mode = deep+
          lib_deps =
              ../dependencies/ESPressio-System
              ../dependencies/ESPressio-Observable
              ../dependencies/ESPressio-Units
              ../dependencies/ESPressio-Timing
              ../dependencies/ESPressio-Task
              ../ESPressio-Threads
          EOF
          cat > project/compile/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <ESPressio_Thread.hpp>
          #include <ESPressio_ThreadManager.hpp>
          #include <ESPressio_ThreadTerminationDispatcher.hpp>

          using namespace ESPressio::Threads;

          class ProbeThread final : public Thread {
          protected:
              void OnLoop() override { delay(1); }
          public:
              explicit ProbeThread(ThreadReleasePolicy policy = ThreadReleasePolicy::ExplicitRelease)
                  : Thread(policy) {
                  SetStartOnInitialize(false);
              }
          } probe;

          void setup() {
              ThreadManager::GetInstance()->Initialize();
              (void)ThreadTerminationDispatcher::GetInstance()->EnsureAvailable();
              (void)probe.Initialize();
              probe.Start();
              probe.Pause();
              probe.Start();
              probe.Terminate();

              auto* automatic = new ProbeThread(ThreadReleasePolicy::ReleaseOnTerminate);
              (void)automatic->Initialize();
              automatic->Start();
              automatic->Terminate();
          }

          void loop() { delay(1000); }
          EOF
      - name: Compile System-backed Threads infrastructure
        shell: bash
        run: |
          set -o pipefail
          pio run -d project/compile 2>&1 | tee threads-runtime-build.log
      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threads-runtime-build-log
          path: threads-runtime-build.log
          if-no-files-found: warn
