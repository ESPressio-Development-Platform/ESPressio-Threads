<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
<style>text{font-family:Arial,sans-serif;fill:#111}.title{font-size:26px;font-weight:700}.node{fill:#fff;stroke:#222;stroke-width:2}.label{font-size:15px;font-weight:600;text-anchor:middle}.small{font-size:12px;text-anchor:middle}.edge{stroke:#333;stroke-width:2;fill:none;marker-end:url(#arrow)}.optional{stroke-dasharray:7 6}</style>
